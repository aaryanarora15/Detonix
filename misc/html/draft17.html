<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacktronics 2026 · Building Fire Hazard Analysis</title>
    <!-- Montserrat Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #030712;
            --surface: rgba(17, 24, 39, 0.75);
            --surface-hover: rgba(31, 41, 55, 0.85);
            --border: rgba(56, 189, 248, 0.15);
            --border-glow: rgba(56, 189, 248, 0.4);
            --text: #F3F4F6;
            --muted: #9CA3AF;
            --accent: #38BDF8;
            --accent-glow: #0EA5E9;
            --cyan: #22D3EE;
            --green: #34D399;
            --orange: #FB923C;
            --red: #F87171;
        }

        html, body { 
            font-family: 'Montserrat', sans-serif; 
            color: var(--text); 
            background: var(--bg); 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        h1, h2, h3, h4, .wordmark { 
            font-family: 'Montserrat', sans-serif; 
            letter-spacing: -0.02em; 
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .app-container { max-width: 1480px; margin: 0 auto; padding: 1.5rem; position: relative; z-index: 1; }

        .topbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-bottom: 16px; margin-bottom: 24px; 
            border-bottom: 1px solid var(--border); 
            background: var(--surface);
            backdrop-filter: blur(16px);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.05);
        }
        .wordmark { font-weight: 800; font-size: 1.35rem; letter-spacing: 1px; color: #fff; }
        .wordmark span { color: var(--accent); text-shadow: 0 0 12px rgba(56,189,248,0.6); }
        .topbar-sub { 
            background: rgba(56, 189, 248, 0.1); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            color: var(--accent); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.78rem; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
        @media(max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

        .card { 
            background: var(--surface); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border); 
            border-radius: 14px; 
            padding: 22px; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: border-color 0.3s;
        }
        .card:hover { border-color: var(--border-glow); }
        .card h4 { margin: 0 0 16px 0; font-size: 0.95rem; color: #fff; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; margin-top: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="number"], input[type="range"] { 
            width: 100%; background: rgba(3, 7, 18, 0.6); border: 1px solid var(--border); 
            border-radius: 8px; color: var(--text); padding: 9px 12px; 
            font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; box-sizing: border-box; 
            transition: all 0.3s;
        }
        input[type="number"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px rgba(56,189,248,0.3); }
        input[type="range"] { padding: 0; accent-color: var(--accent); cursor: pointer; }
        
        .btn-row { display: grid; gap: 10px; margin-bottom: 12px; }
        button.action-btn { 
            background: rgba(31, 41, 55, 0.6); border: 1px solid var(--border); 
            color: var(--text); padding: 10px 14px; border-radius: 8px; 
            font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.82rem; 
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        button.action-btn:hover { background: rgba(56,189,248,0.15); border-color: var(--accent); color: #fff; box-shadow: 0 0 15px rgba(56,189,248,0.2); }
        button.action-btn.active { background: rgba(56,189,248,0.25); color: var(--cyan); border-color: var(--accent); box-shadow: 0 0 20px rgba(56,189,248,0.4); }

        #map { 
            height: 650px !important; 
            width: 100% !important; 
            display: block !important;
            border-radius: 14px; 
            border: 1px solid var(--border-glow); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            z-index: 1; 
        }

        .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 20px; }
        @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background: var(--surface); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .stat-card.emph { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.4); box-shadow: 0 0 20px rgba(248, 113, 113, 0.15); }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.25rem; color: #fff; }
        .stat-card.emph .stat-value { color: var(--red); text-shadow: 0 0 10px rgba(248,113,113,0.5); }
        .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; }
        .stat-sub { font-size: 0.68rem; color: #fff; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; }
        .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor; }

        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div class="app-container">
    <div class="topbar">
        <div class="wordmark">HACKTRONICS <span>2026</span></div>
        <div class="topbar-sub"><i class="fa-solid fa-building-shield mr-1"></i> Building Fire Hazard &amp; Consequence Analysis</div>
    </div>

    <div class="main-grid">
        <div>
            <div class="card">
                <h4><span>1. Building &amp; Material Config</span> <i class="fa-solid fa-house-fire text-sky-400"></i></h4>
                <div class="btn-row" style="grid-template-columns: 1fr 1fr;">
                    <button class="action-btn active" id="btn-Gasoline" onclick="setSubstance('Gasoline')">Gasoline</button>
                    <button class="action-btn" id="btn-Diesel" onclick="setSubstance('Diesel')">Diesel</button>
                </div>
                
                <label>Latitude Coordinates</label>
                <input type="number" id="lat" value="12.8406" step="0.0001" oninput="updateFacility()">

                <label>Longitude Coordinates</label>
                <input type="number" id="lon" value="80.1534" step="0.0001" oninput="updateFacility()">

                <label>Room/Area Volume (m³): <span id="vol-val" class="mono text-sky-400 font-semibold">120</span></label>
                <input type="range" id="volume" min="20" max="500" step="10" value="120" oninput="updateFacility()">

                <label>Combustible Fraction: <span id="frac-val" class="mono text-sky-400 font-semibold">0.3</span></label>
                <input type="range" id="fuel_fraction" min="0.05" max="1.0" step="0.05" value="0.3" oninput="updateFacility()">
                
                <div style="background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 16px; margin-top: 20px; box-shadow: inset 0 0 15px rgba(56,189,248,0.05);">
                    <div class="text-xs text-sky-400 font-bold uppercase tracking-wider">Est. Building Fire HRR / Rate</div>
                    <div class="mono" id="combustion-rate" style="font-size: 1.5rem; margin-top: 6px; color: var(--cyan); text-shadow: 0 0 8px rgba(34,211,238,0.4);">0.0 kg/s</div>
                </div>
                
                <hr>
                <h4><span>2. Atmospheric Conditions</span> <i class="fa-solid fa-wind text-sky-400"></i></h4>
                <button class="action-btn w-full mb-3" onclick="fetchLiveWind()">
                    <i class="fa-solid fa-cloud-bolt mr-2 text-cyan-400"></i> Sync Open-Meteo Weather
                </button>
                <label>True Wind Speed (m/s): <span id="ws-val" class="mono text-sky-400 font-semibold">2.5</span></label>
                <input type="range" id="wind_speed" min="0.0" max="15.0" step="0.5" value="2.5" oninput="updateFacility()">

                <label>True Wind Dir (° from N): <span id="wd-val" class="mono text-sky-400 font-semibold">90</span></label>
                <input type="range" id="wind_dir" min="0" max="360" step="5" value="90" oninput="updateFacility()">
            </div>
        </div>

        <div>
            <div id="map"></div>
            
            <!-- Radii summary stats -->
            <div class="stat-grid" id="stat-grid"></div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 70 },
        "color": { "value": "#38BDF8" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.4 },
        "size": { "value": 2.5 },
        "line_linked": { "enable": true, "distance": 160, "color": "#38BDF8", "opacity": 0.25, "width": 1 },
        "move": { "enable": true, "speed": 1.5, "direction": "none", "out_mode": "out" }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
        "modes": { "grab": { "distance": 150, "line_linked": { "opacity": 0.8 } }, "push": { "particles_nb": 4 } }
      },
      "retina_detect": true
    });

    const THERMAL_BANDS = {"Red": 12.5, "Orange": 4.0, "Yellow": 1.4};
    const BLAST_BANDS = {"Red": 35, "Orange": 15, "Yellow": 3}; 
    const BAND_HEX = {"Red": "#EF4444", "Orange": "#F97316", "Yellow": "#EAB308"};

    const SUBSTANCES = {
        "Gasoline": { density: 740, m_flux: 0.045, dH_c: 4.34e7, eta_rad: 0.20, eta_exp: 0.02 },
        "Diesel": { density: 800, m_flux: 0.030, dH_c: 4.20e7, eta_rad: 0.15, eta_exp: 0.01 }
    };
    
    let currentSubstance = "Gasoline";

    function setSubstance(name) {
        currentSubstance = name;
        document.getElementById('btn-Gasoline').classList.remove('active');
        document.getElementById('btn-Diesel').classList.remove('active');
        document.getElementById(`btn-${name}`).classList.add('active');
        updateFacility();
    }

    // Google Satellite Imagery Tile Layer Integration
    let map = L.map('map', { zoomControl: false }).setView([12.8406, 80.1534], 17); 
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google Maps', 
        maxZoom: 20,
        subdomains: ['mt0','mt1','mt2','mt3']
    }).addTo(map);

    let hazardLayer = L.layerGroup().addTo(map);

    function getDestinationPoint(lat, lon, distanceMeters, bearingDeg) {
        const R = 6371000, rad = Math.PI / 180;
        const lat1 = lat * rad, lon1 = lon * rad, brng = bearingDeg * rad;
        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distanceMeters / R) + Math.cos(lat1) * Math.sin(distanceMeters / R) * Math.cos(brng));
        const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(distanceMeters / R) * Math.cos(lat1), Math.cos(distanceMeters / R) - Math.sin(lat1) * Math.sin(lat2));
        return [lat2 / rad, lon2 / rad];
    }

    function windSkewPolygon(lat, lon, base_radius_m, downwind_bearing_deg, k_down, k_up) {
        let points = [];
        for (let theta = 0; theta < 360; theta += 10) {
            let diff = theta - downwind_bearing_deg + 180;
            let delta_deg = ((diff % 360) + 360) % 360 - 180;
            let delta = delta_deg * (Math.PI / 180);
            
            let stretch = Math.abs(delta_deg) < 90 ? 
                1 + (k_down - 1) * Math.pow(Math.cos(delta), 2) : 
                1 - (1 - k_up) * Math.pow(Math.cos(delta), 2);
                
            points.push(getDestinationPoint(lat, lon, base_radius_m * stretch, theta));
        }
        return points;
    }

    function thermalRadius(threshold_kw, Q_rad_w) {
        return Math.sqrt((Q_rad_w * 0.6) / (4 * Math.PI * threshold_kw * 1000));
    }

    function blastRadius(threshold_kpa, W_TNT) {
        if (W_TNT <= 0) return 0;
        let low = 0.5, high = 2000;
        for (let i = 0; i < 30; i++) {
            let mid = (low + high) / 2;
            let Z = mid / Math.max(0.1, Math.cbrt(W_TNT));
            let p = 1700 / Z; 
            if (p > threshold_kpa) low = mid; else high = mid;
        }
        return (low + high) / 2;
    }

    function updateFacility() {
        let lat = parseFloat(document.getElementById('lat').value);
        let lon = parseFloat(document.getElementById('lon').value);
        let volume = parseFloat(document.getElementById('volume').value);
        let fuel_fraction = parseFloat(document.getElementById('fuel_fraction').value);
        let wind_speed = parseFloat(document.getElementById('wind_speed').value);
        let wind_dir_from = parseFloat(document.getElementById('wind_dir').value);

        document.getElementById('vol-val').innerText = volume;
        document.getElementById('frac-val').innerText = fuel_fraction;
        document.getElementById('ws-val').innerText = wind_speed.toFixed(1);
        document.getElementById('wd-val').innerText = wind_dir_from;

        let mat = SUBSTANCES[currentSubstance];

        let radius_pool = Math.cbrt(volume / (Math.PI * 4)); 
        let A_pool = Math.PI * radius_pool * radius_pool;
        let combustion_rate = mat.m_flux * A_pool;
        document.getElementById('combustion-rate').innerText = `${combustion_rate.toFixed(2)} kg/s`;

        let mass_fuel = volume * mat.density * fuel_fraction;
        let Q_rad = mat.eta_rad * mat.m_flux * A_pool * mat.dH_c;
        let W_TNT = (mat.eta_exp * mass_fuel * mat.dH_c) / 4.184e6;

        let downwind_bearing = (wind_dir_from + 180) % 360;
        let k_down = 1.05 + 0.02 * wind_speed; 
        let k_up = Math.max(0.2, 0.9 - 0.01 * wind_speed);

        hazardLayer.clearLayers();

        let icon = L.divIcon({ className: 'custom-icon', html: '<div style="background:#0f172a; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:#38BDF8; border:2px solid #38BDF8; box-shadow:0 0 10px rgba(56,189,248,0.8);"><i class="fa-solid fa-house-fire" style="font-size:11px;"></i></div>', iconSize: [26, 26], iconAnchor: [13, 13] });
        L.marker([lat, lon], {icon: icon}).bindTooltip(`Building Fire Incident (${currentSubstance})`).addTo(hazardLayer);

        let cardsHtml = '';
        
        for (let [b, threshold] of Object.entries(THERMAL_BANDS)) {
            let r = thermalRadius(threshold, Q_rad);
            let poly = windSkewPolygon(lat, lon, r, downwind_bearing, k_down, k_up);
            L.polygon(poly, { color: BAND_HEX[b], fillColor: BAND_HEX[b], fillOpacity: 0.3, weight: 2 }).addTo(hazardLayer);
            cardsHtml += `<div class="stat-card ${b==='Red'?'emph':''}"><span class="swatch" style="background:${BAND_HEX[b]}; color:${BAND_HEX[b]}"></span><span class="stat-sub" style="color:${BAND_HEX[b]}">Thermal · ${b}</span><div class="stat-value">${r.toFixed(1)} m</div><div class="stat-label">${threshold} kW/m²</div></div>`;
        }

        for (let [b, threshold] of Object.entries(BLAST_BANDS)) {
            let r = blastRadius(threshold, W_TNT);
            let poly = windSkewPolygon(lat, lon, r, downwind_bearing, k_down, k_up);
            L.polygon(poly, { color: BAND_HEX[b], fill: false, dashArray: '4,4', weight: 2 }).addTo(hazardLayer);
            cardsHtml += `<div class="stat-card"><span class="swatch" style="background:${BAND_HEX[b]}; color:${BAND_HEX[b]}"></span><span class="stat-sub" style="color:${BAND_HEX[b]}">Blast · ${b}</span><div class="stat-value">${r.toFixed(1)} m</div><div class="stat-label">${threshold} kPa</div></div>`;
        }

        let downwind_pt = getDestinationPoint(lat, lon, 60, downwind_bearing);
        L.polyline([[lat, lon], downwind_pt], { color: '#38BDF8', weight: 2.5, dashArray: '3,3', opacity: 0.85 }).addTo(hazardLayer);

        document.getElementById('stat-grid').innerHTML = cardsHtml;
        map.invalidateSize();
        map.panTo([lat, lon]);
    }

    async function fetchLiveWind() {
        let lat = document.getElementById('lat').value;
        let lon = document.getElementById('lon').value;
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const data = await res.json();
            document.getElementById('wind_speed').value = (data.current_weather.windspeed / 3.6).toFixed(1);
            document.getElementById('wind_dir').value = data.current_weather.winddirection;
            updateFacility();
        } catch(e) {
            alert("External weather API unavailable.");
        }
    }

    updateFacility();
    setTimeout(() => { map.invalidateSize(); }, 200);
</script>
</body>
</html>
